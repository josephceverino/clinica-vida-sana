<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Tubos de ensayo y matraz de laboratorio">
  <!-- Ilustración propia (Clínica Vida Sana). Se puede cambiar por una foto. -->
  <circle cx="240" cy="190" r="150" fill="#FFFFFF" opacity="0.10"/>
  <!-- Gradilla -->
  <rect x="110" y="250" width="190" height="16" rx="4" fill="#FFFFFF" opacity="0.85"/>
  <rect x="110" y="170" width="190" height="12" rx="4" fill="#FFFFFF" opacity="0.5"/>
  <!-- Tubos de ensayo -->
  <g>
    <rect x="135" y="120" width="26" height="130" rx="13" fill="#FFFFFF" opacity="0.9"/>
    <rect x="139" y="190" width="18" height="56" rx="9" fill="#2BB673"/>
    <rect x="192" y="105" width="26" height="145" rx="13" fill="#FFFFFF" opacity="0.9"/>
    <rect x="196" y="160" width="18" height="86" rx="9" fill="#E05A47"/>
    <rect x="249" y="130" width="26" height="120" rx="13" fill="#FFFFFF" opacity="0.9"/>
    <rect x="253" y="205" width="18" height="41" rx="9" fill="#F2C08B"/>
  </g>
  <!-- Matraz -->
  <path d="M345 120 h30 v50 l40 80 a14 14 0 0 1 -12 20 h-86 a14 14 0 0 1 -12 -20 l40 -80 Z"
        fill="#FFFFFF" opacity="0.9"/>
  <path d="M325 225 h70 l14 28 a8 8 0 0 1 -7 12 h-84 a8 8 0 0 1 -7 -12 Z" fill="#2BB673"/>
  <!-- Burbujas -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="372" cy="95" r="7"/><circle cx="390" cy="70" r="5"/><circle cx="365" cy="55" r="4"/>
  </g>
</svg>
