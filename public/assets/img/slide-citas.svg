<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Celular con una cita confirmada">
  <!-- Ilustración propia (Clínica Vida Sana). Se puede cambiar por una foto. -->
  <circle cx="240" cy="180" r="150" fill="#FFFFFF" opacity="0.10"/>
  <!-- Celular -->
  <rect x="165" y="50" width="150" height="270" rx="22" fill="#0F2A3D"/>
  <rect x="175" y="68" width="130" height="234" rx="12" fill="#FFFFFF"/>
  <!-- Calendario en la pantalla -->
  <rect x="190" y="88" width="100" height="22" rx="5" fill="#0B6E8A"/>
  <g fill="#DDE5EA">
    <rect x="192" y="122" width="18" height="16" rx="3"/><rect x="216" y="122" width="18" height="16" rx="3"/>
    <rect x="240" y="122" width="18" height="16" rx="3"/><rect x="264" y="122" width="18" height="16" rx="3"/>
    <rect x="192" y="144" width="18" height="16" rx="3"/><rect x="240" y="144" width="18" height="16" rx="3"/>
    <rect x="264" y="144" width="18" height="16" rx="3"/>
    <rect x="192" y="166" width="18" height="16" rx="3"/><rect x="216" y="166" width="18" height="16" rx="3"/>
  </g>
  <rect x="216" y="144" width="18" height="16" rx="3" fill="#2BB673"/>
  <!-- Botón "Confirmada" -->
  <rect x="190" y="205" width="100" height="26" rx="13" fill="#2BB673"/>
  <path d="M206 218 l6 6 12 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="232" y="214" width="46" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="190" y="245" width="100" height="8" rx="4" fill="#DDE5EA"/>
  <rect x="190" y="261" width="70" height="8" rx="4" fill="#DDE5EA"/>
  <!-- Burbuja de aviso -->
  <circle cx="330" cy="70" r="26" fill="#2BB673"/>
  <path d="M318 70 l8 8 16 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
