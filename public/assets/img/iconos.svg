<svg xmlns="http://www.w3.org/2000/svg">
    <!-- Iconos del panel. Cada <symbol> se usa así:
         <svg class="icono"><use href=".../iconos.svg#i-citas"></use></svg>
         Toman el color del texto (currentColor). Dibujo de 24 x 24. -->

    <!-- Panel general: cuatro cuadros -->
    <symbol id="i-resumen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
    </symbol>

    <!-- Personas (pacientes, usuarios) -->
    <symbol id="i-personas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.5"/>
        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
        <path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4"/>
        <path d="M18 14.5c2.1.7 3.5 2.7 3.5 5.5"/>
    </symbol>

    <!-- Calendario (citas, horarios) -->
    <symbol id="i-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
        <path d="M3.5 10h17M8 3v4M16 3v4"/>
    </symbol>

    <!-- Reloj (agenda) -->
    <symbol id="i-reloj" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 7.5V12l3 2"/>
    </symbol>

    <!-- Documento (solicitudes, auditoría) -->
    <symbol id="i-documento" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5M9 13h6M9 17h6"/>
    </symbol>

    <!-- Escudo con visto (cuentas, perfil) -->
    <symbol id="i-escudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/>
        <path d="M8.8 12.2l2.2 2.2 4.2-4.4"/>
    </symbol>

    <!-- Salir -->
    <symbol id="i-salir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/>
        <path d="M14.5 8l4 4-4 4M18.5 12H9"/>
    </symbol>

    <!-- Menú (tres rayas) -->
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>

    <!-- Contraer el menú (doble flecha a la izquierda) -->
    <symbol id="i-contraer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
    </symbol>

    <!-- Cerrar (X) -->
    <symbol id="i-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>

    <!-- Cruz de la marca -->
    <symbol id="i-cruz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 4v16M4 12h16"/>
    </symbol>
</svg>
