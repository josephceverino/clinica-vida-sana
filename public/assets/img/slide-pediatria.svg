  <!-- Globos -->
  <line x1="350" y1="150" x2="300" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="395" y1="120" x2="305" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <ellipse cx="350" cy="120" rx="30" ry="36" fill="#2BB673"/>
  <ellipse cx="398" cy="90" rx="26" ry="32" fill="#FFFFFF" opacity="0.85"/>
  <!-- Osito -->
  <g>
    <circle cx="190" cy="140" r="20" fill="#F2C08B"/>
    <circle cx="270" cy="140" r="20" fill="#F2C08B"/>
    <circle cx="190" cy="140" r="10" fill="#E0A26A"/>
    <circle cx="270" cy="140" r="10" fill="#E0A26A"/>
    <ellipse cx="230" cy="250" rx="62" ry="58" fill="#F2C08B"/>
    <ellipse cx="230" cy="258" rx="34" ry="32" fill="#FBE3C6"/>
    <circle cx="230" cy="175" r="52" fill="#F2C08B"/>
    <ellipse cx="230" cy="192" rx="22" ry="16" fill="#FBE3C6"/>
    <circle cx="212" cy="168" r="5" fill="#0F2A3D"/>
    <circle cx="248" cy="168" r="5" fill="#0F2A3D"/>
    <ellipse cx="230" cy="186" rx="7" ry="5" fill="#0F2A3D"/>
    <path d="M222 198 Q230 205 238 198" fill="none" stroke="#0F2A3D" stroke-width="2.5" stroke-linecap="round"/>
