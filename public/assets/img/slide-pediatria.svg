  </g>
  <!-- Estrellas -->
  <g fill="#FFFFFF" opacity="0.6">
    <path d="M90 90 l6 14 15 1 -12 9 4 15 -13 -8 -13 8 4 -15 -12 -9 15 -1 Z"/>
    <path d="M100 270 l4 9 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1 Z"/>
